name: Build and Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    # This is the key line: it runs on an actual Windows VM that GitHub
    # provides for free, not a Linux container - so this is real proof the
    # WPF app compiles, not just a syntax guess.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # No separate restore step: `dotnet restore` only accepts a single
      # project/solution path, so passing two here was invalid CLI usage
      # and failed immediately. `dotnet build` and `dotnet test` each
      # restore their own project automatically when --no-restore isn't
      # passed, so this is simpler AND correct.
      - name: Build app
        run: dotnet build GameWatch/GameWatch.csproj --configuration Release

      - name: Run tests
        run: dotnet test GameWatch.Tests/GameWatch.Tests.csproj --configuration Release
